// Every device — the dispenser and every caregiver phone — signs in
// anonymously so Firestore security rules can tell "someone with the app
// open" apart from "the open internet." It's invisible to the user; there's
// no password screen for the elderly person.
async function ensureSignedIn() {
  if (!fb) return null;
  if (fb.auth.currentUser) return fb.auth.currentUser;
  try {
    const cred = await fb.auth.signInAnonymously();
    return cred.user;
  } catch (e) {
    console.warn("Firebase anonymous sign-in failed", e);
    return null;
  }
}

// One Firestore document per family, keyed by the 6-digit link code the
// caregiver's setup screen already generates. Whoever holds the code
// (dispenser or caregiver phone) reads and writes the same document, which
// is what actually keeps the two devices in sync — localStorage alone
// can never do that because it never leaves the browser it was written in.
function familyDocRef(linkCode) {
  if (!fb || !linkCode) return null;
  return fb.db.collection("families").doc(String(linkCode));
}

  async get(key) {
    try {
      const v = window.localStorage.getItem(key);
      return v !== null ? { value: v } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try { window.localStorage.setItem(key, value); return { value }; } catch (e) { return null; }
  },
};

function uid() { return Math.random().toString(36).slice(2, 10); }

// The elder-facing screen borrows its color from the actual sky outside —
// dawn, day, dusk, night — so the device reads as a bedside object that
// belongs to the time of day, not a generic app screen.
function getElderTheme(hour) {
  if (hour >= 5 && hour < 8) {
    return { grad: "linear-gradient(180deg, #F6D6B4 0%, #FAE9D6 52%, #F6EFDF 100%)", night: false, name: "dawn" };
  }
  if (hour >= 8 && hour < 17) {
    return { grad: "linear-gradient(180deg, #D6E5EC 0%, #E9F0E7 52%, #F3F1E5 100%)", night: false, name: "day" };
  }
  if (hour >= 17 && hour < 20) {
    return { grad: "linear-gradient(180deg, #E6C9D2 0%, #F1DAC2 52%, #F6ECDC 100%)", night: false, name: "dusk" };
  }
  return { grad: "linear-gradient(180deg, #131A2A 0%, #1E2740 52%, #2A3350 100%)", night: true, name: "night" };
}

function todayKey(d) { return d.toISOString().slice(0, 10); }
function weekdayKey(d) { return DAY_KEYS[d.getDay()]; }

function formatTime12(hhmm) {
  if (!hhmm) return "--:--";
  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}:${String(m).padStart(2, "0")} ${period}`;
}

function daysSummary(days) {
  const on = DAY_KEYS.filter((d) => days[d]);
  if (on.length === 7) return "Every day";
  if (on.length === 0) return "No days set";
  return on.join(", ");
}

function minutesUntil(now, hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const target = new Date(now);
  target.setHours(h, m, 0, 0);
  return (target - now) / 60000;
}

function decrementStock(slots, slotId) {
  return slots.map((s) => {
    if (s.id !== slotId) return s;
    if (s.stock === "" || s.stock === null || s.stock === undefined) return s;
    const n = Number(s.stock);
    if (Number.isNaN(n)) return s;
    return { ...s, stock: Math.max(0, n - 1) };
  });
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [660, 880, 660];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.35);
      gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + i * 0.35 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.35 + 0.32);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.35);
      osc.stop(ctx.currentTime + i * 0.35 + 0.34);
    });
  } catch (e) { /* audio not available */ }
}

/* ---------------- GEMINI API ----------------
   The browser now calls Gemini directly — no Cloud Function in between.
   That means GEMINI_API_KEY below ships inside the client JS and is
   visible to anyone who opens dev tools or views source. Google's own
   docs recommend keeping API keys server-side for exactly this reason;
   this trade-off was made deliberately here to drop the Cloud Function.
   If that's a problem for you, restrict the key in Google Cloud Console
   (HTTP referrer restrictions, API restrictions to only the Generative
   Language API) so a stolen key at least can't be reused elsewhere or
   run up spend on other APIs. Get a key (no credit card) at
   https://aistudio.google.com */
const GEMINI_API_KEY = "AQ.Ab8RN6Jm7Fzz7U_BZHDmbP0nxo9PSqNx20KCHjtQbWZsSuhhOA";
const GEMINI_MODEL = "gemini-2.5-flash";

function geminiConfigured() {
  return !!GEMINI_API_KEY && GEMINI_API_KEY !== "YOUR_GEMINI_API_KEY";
}

async function callGemini(body) {
  if (!geminiConfigured()) {
    throw new Error("Gemini isn't configured yet — set GEMINI_API_KEY near the top of this file.");
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Gemini API error ${res.status}: ${text}`);
  }
  return res.json();
}

function extractGeminiText(data) {
  const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  if (!parts) return "";
  return parts.map((p) => p.text || "").join("\n").trim();
}

// Used by the "Ask a question" chatbot on both the elderly and caregiver screens.
async function askClaude(messages, system) {
  const contents = messages.map((m) => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: [{ text: m.content }],
  }));
  const body = { contents };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const data = await callGemini(body);
  return extractGeminiText(data) || "Sorry, I didn't catch that.";
}

// Used by the caregiver's "Scan medication" feature: reads a photo of a
// label and returns a structured suggestion for which slot to assign it to.
async function askClaudeVision(base64, mediaType) {
  const prompt =
    'This is a photo of a medication box or label. Read the medicine name and dosage instructions. ' +
    'Reply with ONLY a compact JSON object, no markdown, no other text, in this exact shape: ' +
    '{"name": string, "dose": string, "timesPerDay": number, "suggestedTime": "HH:MM", "notes": string}. ' +
    'If you cannot read something, use your best reasonable guess or an empty string.';

  const body = {
    contents: [
      {
        role: "user",
        parts: [
          { inline_data: { mime_type: mediaType || "image/jpeg", data: base64 } },
          { text: prompt },
        ],
      },
    ],
  };

  const data = await callGemini(body);
  const raw = extractGeminiText(data);
  const clean = raw.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function stateSummaryForAI(state) {
  const active = state.slots.filter((s) => s.active && s.name)
    .map((s) => `${s.name} at ${formatTime12(s.time)} (${daysSummary(s.days)})${s.dose ? ", " + s.dose : ""}${s.stock !== "" ? `, ${s.stock} left` : ""}`);
  const last10 = [...state.logs].sort((a, b) => new Date(b.scheduledAt) - new Date(a.scheduledAt)).slice(0, 10)
    .map((l) => `${l.date} ${l.name}: ${l.status}`);
  return `Elderly person: ${state.profile.elderlyName || "not set"}.\nActive schedule:\n${active.join("\n") || "none set up yet"}\nRecent log entries:\n${last10.join("\n") || "none yet"}`;
}

function App() {
  const [state, setState] = useState(null);
  const [view, setView] = useState("loading");
  const [tab, setTab] = useState("overview");
  const [toast, setToast] = useState(null);
  const [helpOpen, setHelpOpen] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const stateRef = useRef(null);
  const lastAlertedSlotRef = useRef(null);

  const [chatOpen, setChatOpen] = useState(false);
  const [scanOpen, setScanOpen] = useState(false);

  const routeAfterLoad = (s) => {
    if (!s.setupComplete) { setView("setup"); return; }
    // Resuming on a device that already picked a role skips straight to it —
    // this is what lets a grandparent's screen reopen exactly where it was
    // if the app was accidentally closed or the tablet restarted.
    setView(s.deviceRole || "roleSelect");
  };

  useEffect(() => {
    ensureSignedIn();
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          stateRef.current = parsed;
          setState(parsed);
          routeAfterLoad(parsed);
        } else {
          const d = defaultState();
          stateRef.current = d; setState(d); setView("setup");
        }
      } catch (e) {
        const d = defaultState();
        stateRef.current = d; setState(d); setView("setup");
      }
    })();
  }, []);

  // Writes go to localStorage immediately (so the UI never waits on a
  // network round trip) and, once this device is linked to a family, to
  // that family's Firestore document too — that second write is what the
  // other linked device picks up.
  const persist = useCallback(async (next) => {
    stateRef.current = next;
    setState(next);
    try { await storage.set(STORAGE_KEY, JSON.stringify(next)); } catch (e) { /* best effort */ }
    const code = next && next.account && next.account.linkCode;
    if (fb && code && next.setupComplete) {
      try {
        await ensureSignedIn();
        await familyDocRef(code).set(next, { merge: false });
      } catch (e) { /* Firestore write failed — localStorage cache still holds this device's copy */ }
    }
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  // Real-time cross-device sync: once this device knows its family's link
  // code, it subscribes to that one Firestore document. When the caregiver
  // edits the schedule on their phone, the dispenser's screen updates
  // within about a second — no polling, no refresh needed.
  useEffect(() => {
    const code = state && state.account && state.account.linkCode;
    if (!fb || !code || !state.setupComplete) return;
    let unsub = null;
    (async () => {
      await ensureSignedIn();
      unsub = familyDocRef(code).onSnapshot((doc) => {
        if (!doc.exists) return;
        const remote = doc.data();
        if (JSON.stringify(remote) !== JSON.stringify(stateRef.current)) {
          stateRef.current = remote;
          setState(remote);
          storage.set(STORAGE_KEY, JSON.stringify(remote)).catch(() => {});
        }
      }, (e) => console.warn("Firestore sync error", e));
    })();
    return () => { if (unsub) unsub(); };
  }, [state && state.account && state.account.linkCode, state && state.setupComplete]);

  useEffect(() => {
    if (!state) return;
    const tick = () => {
      const cur = stateRef.current;
      if (!cur) return;
      const now = new Date();
      const tKey = todayKey(now);
      const wKey = weekdayKey(now);
      let logs = [...cur.logs];
      let activeAlert = cur.activeAlert;
      let changed = false;

      cur.slots.forEach((slot) => {
        if (!slot.active || !slot.days[wKey] || !slot.name) return;
        const [h, m] = slot.time.split(":").map(Number);
        const scheduled = new Date(now); scheduled.setHours(h, m, 0, 0);
        const existing = logs.find((l) => l.slotId === slot.id && l.date === tKey);

        if (!existing) {
          if (now >= scheduled) {
            const log = { id: `${slot.id}-${tKey}`, slotId: slot.id, date: tKey, name: slot.name,
              scheduledAt: scheduled.toISOString(), status: "pending", actionAt: null, synthetic: false };
            logs.push(log);
            if (!activeAlert) activeAlert = { slotId: slot.id, logId: log.id, triggeredAt: now.toISOString(), snoozedUntil: null };
            changed = true;
          }
        } else if (existing.status === "pending") {
          const minsPast = (now - new Date(existing.scheduledAt)) / 60000;
          if (minsPast > cur.settings.missedAfterMinutes) {
            existing.status = "missed"; changed = true;
            if (activeAlert && activeAlert.slotId === slot.id) activeAlert = null;
          } else if (!activeAlert) {
            activeAlert = { slotId: slot.id, logId: existing.id, triggeredAt: existing.scheduledAt, snoozedUntil: null };
            changed = true;
          }
        }
      });

      if (changed) persist({ ...cur, logs, activeAlert });
    };
    tick();
    const interval = setInterval(tick, 15000);
    return () => clearInterval(interval);
  }, [state, persist]);

  useEffect(() => {
    if (!state) return;
    const alert = state.activeAlert;
    if (alert && alert.slotId !== lastAlertedSlotRef.current) {
      lastAlertedSlotRef.current = alert.slotId;
      if (state.settings.soundOn && view === "elderly") playChime();
    }
    if (!alert) lastAlertedSlotRef.current = null;
  }, [state, view]);

  if (view === "loading" || !state) {
    return (
      <div className="app-frame boot-frame">
        <GlobalStyle />
        <LogoMark size={44} />
        <span className="boot-text">Loading PillPal…</span>
        <div className="boot-bar"><div className="boot-bar-fill" /></div>
      </div>
    );
  }

  const lang = state.language || "en";
  const switchRole = () => persist({ ...state, deviceRole: null }).then(() => setView("roleSelect"));
  const pickRole = (v) => { setTab("overview"); persist({ ...state, deviceRole: v }); setView(v); };
  const resetApp = () => { const d = defaultState(); persist(d); setView("setup"); };

  return (
    <div className="pillpal-root">
      <GlobalStyle />
      {view === "setup" && (
        <Setup
          state={state}
          persist={persist}
          onDone={(finalState) => {
            persist(finalState);
            setView(finalState.deviceRole || "roleSelect");
          }}
        />
      )}
      {view === "roleSelect" && (
        <RoleSelect profile={state.profile} lang={lang} onPick={pickRole} />
      )}
      {view === "caregiver" && (
        <Caregiver
          state={state} tab={tab} setTab={setTab} persist={persist} onSwitch={switchRole}
          showToast={showToast} confirmReset={confirmReset} setConfirmReset={setConfirmReset}
          onOpenChat={() => setChatOpen(true)} onOpenScan={() => setScanOpen(true)} onResetApp={resetApp}
        />
      )}
      {view === "elderly" && (
        <Elderly
          state={state} persist={persist} onSwitch={switchRole} helpOpen={helpOpen} setHelpOpen={setHelpOpen}
          onOpenChat={() => setChatOpen(true)}
        />
      )}
      {chatOpen && (
        <ChatModal
          state={state} role={view === "caregiver" ? "caregiver" : "elderly"} lang={lang}
          onClose={() => setChatOpen(false)}
        />
      )}
      {scanOpen && (
        <ScanModal
          state={state} persist={persist} showToast={showToast}
          onClose={() => setScanOpen(false)}
        />
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ---------------- CAREGIVER ---------------- */
function Caregiver({ state, tab, setTab, persist, onSwitch, showToast, confirmReset, setConfirmReset, onOpenChat, onOpenScan, onResetApp }) {
  const tabs = [
    { key: "overview", label: "Overview", icon: LayoutGrid },
    { key: "schedule", label: "Schedule", icon: CalendarDays },
    { key: "messages", label: "Messages", icon: MessageCircle },
    { key: "log", label: "Log", icon: ClipboardList },
    { key: "contacts", label: "Contacts", icon: Users },
    { key: "settings", label: "Settings", icon: Settings },
  ];

  const updateSlot = (id, patch) => persist({ ...state, slots: state.slots.map((s) => (s.id === id ? { ...s, ...patch } : s)) });

  const testPing = (slot) => {
    if (!slot.name) { showToast("Add a medicine name before testing this slot."); return; }
    const now = new Date();
    const log = { id: `${slot.id}-${todayKey(now)}-test-${now.getTime()}`, slotId: slot.id, date: todayKey(now),
      name: slot.name, scheduledAt: now.toISOString(), status: "pending", actionAt: null, synthetic: true };
    const logs = [...state.logs.filter((l) => !(l.slotId === slot.id && l.date === todayKey(now) && l.status === "pending")), log];
    persist({ ...state, logs, activeAlert: { slotId: slot.id, logId: log.id, triggeredAt: now.toISOString(), snoozedUntil: null } });
    showToast(`Test alert sent to the elderly view for "${slot.name}".`);
  };

  const manualMark = (slot, status) => {
    const now = new Date();
    const tKey = todayKey(now);
    const existing = state.logs.find((l) => l.slotId === slot.id && l.date === tKey);
    let logs;
    if (existing) {
      logs = state.logs.map((l) => (l.id === existing.id ? { ...l, status, actionAt: now.toISOString() } : l));
    } else {
      const [h, m] = slot.time.split(":").map(Number);
      const scheduled = new Date(now); scheduled.setHours(h, m, 0, 0);
      logs = [...state.logs, { id: `${slot.id}-${tKey}`, slotId: slot.id, date: tKey, name: slot.name,
        scheduledAt: scheduled.toISOString(), status, actionAt: now.toISOString(), synthetic: false }];
    }
    let slots = state.slots;
    if (status === "taken") slots = decrementStock(slots, slot.id);
    let activeAlert = state.activeAlert;
    if (activeAlert && activeAlert.slotId === slot.id) activeAlert = null;
    persist({ ...state, logs, slots, activeAlert });
    showToast(`Marked "${slot.name}" as ${status}.`);
  };

  const resetAll = () => { onResetApp(); setConfirmReset(false); };

  return (
    <div className="app-frame">
      <header className="app-header">
        <div className="app-header-left"><LogoMark size={30} /><span className="app-header-title">PillPal</span></div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="icon-btn" onClick={onOpenScan} title="Scan medication"><Camera size={17} /></button>
          <button className="icon-btn" onClick={onSwitch} title="Switch view"><RotateCcw size={17} /></button>
        </div>
      </header>
      <div className="app-content">
        {tab === "overview" && <Overview state={state} setTab={setTab} manualMark={manualMark} />}
        {tab === "schedule" && <Schedule state={state} updateSlot={updateSlot} testPing={testPing} onOpenScan={onOpenScan} />}
        {tab === "messages" && <Messages state={state} persist={persist} role="caregiver" />}
        {tab === "log" && <Log state={state} manualMark={manualMark} />}
        {tab === "contacts" && <Contacts state={state} persist={persist} showToast={showToast} />}
        {tab === "settings" && (
          <SettingsPanel state={state} persist={persist} confirmReset={confirmReset} setConfirmReset={setConfirmReset} resetAll={resetAll} />
        )}
      </div>
      <button className="fab-chat" onClick={onOpenChat} title="Ask the PillPal assistant"><Sparkles size={20} /></button>
      <nav className="app-tabbar">
        {tabs.map((tb) => (
          <button key={tb.key} className={`tabbar-item ${tab === tb.key ? "active" : ""}`} onClick={() => setTab(tb.key)}>
            <tb.icon size={19} />
            <span>{tb.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

function Overview({ state, setTab, manualMark }) {
  const now = new Date();
  const wKey = weekdayKey(now);
  const tKey = todayKey(now);
  const todaysSlots = state.slots
    .filter((s) => s.active && s.name && s.days[wKey])
    .map((s) => {
      const log = state.logs.find((l) => l.slotId === s.id && l.date === tKey);
      return { ...s, status: log ? log.status : "upcoming" };
    })
    .sort((a, b) => a.time.localeCompare(b.time));

  const lowStock = state.slots.filter((s) => s.active && s.stock !== "" && s.stock !== null && Number(s.stock) <= Number(s.lowStockAt));

  const last7 = Array.from({ length: 7 }, (_, i) => { const d = new Date(now); d.setDate(d.getDate() - i); return todayKey(d); });
  const recentLogs = state.logs.filter((l) => last7.includes(l.date) && l.status !== "pending");
  const taken = recentLogs.filter((l) => l.status === "taken").length;
  const missed = recentLogs.filter((l) => l.status === "missed").length;
  const total = taken + missed;
  const adherence = total ? Math.round((taken / total) * 100) : null;

  const radius = 86, cx = 110, cy = 110;
  const activeWithTime = state.slots.filter((s) => s.active && s.name);

  return (
    <div className="section">
      <h2 className="section-title">Overview</h2>

      <div className="card clock-card">
        <div className="card-label">Today's doses by time</div>
        <svg viewBox="0 0 220 220" className="clock-svg">
          <defs>
            <linearGradient id="clockRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="var(--teal)" />
              <stop offset="100%" stopColor="var(--amber)" />
            </linearGradient>
          </defs>
          <circle cx={cx} cy={cy} r={radius} fill="var(--slate-50)" stroke="var(--slate-100)" strokeWidth="2" />
          <circle cx={cx} cy={cy} r={radius} fill="none" stroke="url(#clockRing)" strokeWidth="1.5" strokeOpacity="0.35" />
          {Array.from({ length: 12 }, (_, i) => {
            const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
            const x1 = cx + Math.cos(angle) * (radius - 6), y1 = cy + Math.sin(angle) * (radius - 6);
            const x2 = cx + Math.cos(angle) * radius, y2 = cy + Math.sin(angle) * radius;
            return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--slate-800)" strokeOpacity="0.2" strokeWidth="2" />;
          })}
          {activeWithTime.map((s) => {
            const [h, m] = s.time.split(":").map(Number);
            const angle = ((h % 12) + m / 60) / 12 * 2 * Math.PI - Math.PI / 2;
            const x = cx + Math.cos(angle) * (radius - 18), y = cy + Math.sin(angle) * (radius - 18);
            const log = state.logs.find((l) => l.slotId === s.id && l.date === tKey);
            const color = log?.status === "taken" ? "var(--sage)" : log?.status === "missed" ? "var(--clay)" : "var(--amber)";
            return <circle key={s.id} cx={x} cy={y} r={7} fill={color} stroke="#fff" strokeWidth="1.5" />;
          })}
          <circle cx={cx} cy={cy} r={3} fill="var(--ink)" />
        </svg>
        <div className="clock-legend">
          <span><i className="dot" style={{ background: "var(--amber)" }} /> Upcoming / pending</span>
          <span><i className="dot" style={{ background: "var(--sage)" }} /> Taken</span>
          <span><i className="dot" style={{ background: "var(--clay)" }} /> Missed</span>
        </div>
      </div>

      <div className="card">
        <div className="card-label">7-day adherence</div>
        <div className="adherence-num">{adherence === null ? "—" : `${adherence}%`}</div>
        <div className="adherence-sub">{total ? `${taken} taken · ${missed} missed` : "No recorded doses yet"}</div>
        <div className="adherence-bar"><div className="adherence-bar-fill" style={{ width: `${adherence || 0}%` }} /></div>
      </div>

      {lowStock.length > 0 && (
        <div className="card alert-card">
          <div className="card-label" style={{ color: "var(--clay)" }}><PackageMinus size={14} style={{ verticalAlign: "-2px", marginRight: 4 }} />Running low</div>
          {lowStock.map((s) => (
            <div key={s.id} className="today-row">
              <span className="today-name">{s.name}</span>
              <span className="stock-pill">{s.stock} left</span>
            </div>
          ))}
        </div>
      )}

      <div className="card">
        <div className="card-label">Today's schedule</div>
        {todaysSlots.length === 0 && <div className="empty-note">No active doses scheduled for today. Add one in Schedule.</div>}
        {todaysSlots.map((s) => (
          <div key={s.id} className="today-row">
            <span className="today-time">{formatTime12(s.time)}</span>
            <span className="today-name">{s.name}</span>
            <StatusBadge status={s.status} />
            {(s.status === "pending" || s.status === "upcoming") && (
              <button className="mini-icon-btn" title="Mark taken" onClick={() => manualMark(s, "taken")}><Check size={13} /></button>
            )}
          </div>
        ))}
        <button className="link-btn" onClick={() => setTab("schedule")}>Edit schedule <ChevronRight size={14} /></button>
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const map = {
    taken: { label: "Taken", cls: "badge-taken" },
    missed: { label: "Missed", cls: "badge-missed" },
    pending: { label: "Pending", cls: "badge-pending" },
    upcoming: { label: "Upcoming", cls: "badge-upcoming" },
  };
  const s = map[status] || map.upcoming;
  return <span className={`badge ${s.cls}`}>{s.label}</span>;
}

/* ---------------- SCHEDULE (accordion cards) ---------------- */

        <Camera size={18} /> Scan a medication label with AI

      {state.slots.map((slot) => {

        return (
          <div key={slot.id} className={`slot-card ${slot.active ? "" : "slot-card--off"}`}>

/* ---------------- LOG (card list) ---------------- */
function Log({ state, manualMark }) {
  const [range, setRange] = useState(7);
  const now = new Date();
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate() - range);
  const rows = [...state.logs]
    .filter((l) => range === 0 || new Date(l.scheduledAt) >= cutoff)
    .sort((a, b) => new Date(b.scheduledAt) - new Date(a.scheduledAt));

  return (
    <div className="section">
      <h2 className="section-title">Adherence log</h2>
      <div className="range-row">
        {[{ v: 7, l: "7 days" }, { v: 30, l: "30 days" }, { v: 0, l: "All" }].map((r) => (
          <button key={r.v} className={`range-btn ${range === r.v ? "active" : ""}`} onClick={() => setRange(r.v)}>{r.l}</button>
        ))}
      </div>
      {rows.length === 0 && <div className="empty-note">No entries in this range yet.</div>}
      {rows.map((l) => {
        const slot = state.slots.find((s) => s.id === l.slotId);
        return (
          <div key={l.id} className="log-card">
            <div className="log-card-top">
              <span className="log-date">{l.date}</span>
              <StatusBadge status={l.status} />
            </div>
            <div className="log-name">{l.name}{l.synthetic ? " · test" : ""}</div>
            <div className="log-time mono">Scheduled {new Date(l.scheduledAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
              {l.actionAt ? ` · Action ${new Date(l.actionAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` : ""}</div>

}

/* ---------------- ELDERLY ---------------- */
function Elderly({ state, persist, onSwitch, helpOpen, setHelpOpen, onOpenChat }) {
  const [now, setNow] = useState(new Date());
  const [msgOpen, setMsgOpen] = useState(false);
  useEffect(() => { const iv = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(iv); }, []);
  const lang = state.language || "en";

  const theme = getElderTheme(now.getHours());
  const alert = state.activeAlert;
  const snoozed = alert?.snoozedUntil && new Date(alert.snoozedUntil) > now;
  const showOverlay = alert && !snoozed;
  const alertSlot = alert ? state.slots.find((s) => s.id === alert.slotId) : null;

  const wKey = weekdayKey(now);
  const upcoming = state.slots
    .filter((s) => s.active && s.name && s.days[wKey])
    .map((s) => ({ ...s, mins: minutesUntil(now, s.time) }))
    .filter((s) => s.mins > -1)
    .sort((a, b) => a.mins - b.mins)[0];

  const takeMedicine = () => {
    let slots = decrementStock(state.slots, alert.slotId);
    const logs = state.logs.map((l) => (l.id === alert.logId ? { ...l, status: "taken", actionAt: now.toISOString() } : l));
    persist({ ...state, logs, slots, activeAlert: null });
  };
  const snooze = () => persist({ ...state, activeAlert: { ...alert, snoozedUntil: new Date(now.getTime() + state.settings.snoozeMinutes * 60000).toISOString() } });
  const primaryContact = state.profile.contacts?.[0];

  return (
    <div className="app-frame" style={{ background: theme.grad }}>
      <div className={`elder-content ${theme.night ? "elder-content--night" : ""}`}>
        <button className="elder-switch" onClick={onSwitch} title="Switch view">⇄</button>
        <div className="elder-top">
          <div className="elder-greeting">
            {now.getHours() < 18 ? <Sun size={20} /> : <Moon size={20} />}
            <span>{now.getHours() < 12 ? "Good morning" : now.getHours() < 18 ? "Good afternoon" : "Good evening"}{state.profile.elderlyName ? `, ${state.profile.elderlyName}` : ""}</span>
          </div>
          <div className="elder-clock">{now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
          <div className="elder-date">{now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</div>
        </div>

        <div className="elder-card">
          {upcoming ? (
            <>
              <div className="elder-card-label">Your next medicine</div>
              <div className="elder-card-name"><Pill size={26} /> {upcoming.name}</div>
              <div className="elder-card-time">{formatTime12(upcoming.time)}</div>
            </>
          ) : (
            <>
              <CheckCircle2 size={38} color="#6F9683" />
              <div className="elder-card-name">All done for today</div>
            </>
          )}
        </div>

        <button className="elder-help-btn" onClick={() => setHelpOpen(true)}><Phone size={22} /> {t("needHelp", lang)}</button>

        <div className="elder-quick-row">
          <button className="elder-quick-btn" onClick={() => setMsgOpen(true)}>
            <MessageCircle size={22} /> <span>{t("message", lang)}</span>
          </button>
          <button className="elder-quick-btn" onClick={onOpenChat}>
            <Sparkles size={22} /> <span>{t("askQuestion", lang)}</span>
          </button>
          <a className="elder-quick-btn" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
            <Youtube size={22} /> <span>{t("watch", lang)}</span>
          </a>
        </div>
      </div>

      {showOverlay && alertSlot && (
        <div className="elder-overlay">
          <div className="elder-overlay-card">
            <div className="elder-pill-icon"><Pill size={48} color="#fff" /></div>
            <div className="elder-overlay-title">Time for your medicine</div>
            <div className="elder-overlay-name">{alertSlot.name}</div>
            {alertSlot.dose && <div className="elder-overlay-dose">{alertSlot.dose}</div>}
            <button className="elder-take-btn" onClick={takeMedicine}><Check size={24} /> I took it</button>
            <button className="elder-snooze-btn" onClick={snooze}>Remind me in {state.settings.snoozeMinutes} minutes</button>
          </div>
        </div>
      )}

      {helpOpen && (
        <div className="elder-overlay">
          <div className="elder-overlay-card">
            <ShieldAlert size={40} color="#B65C4B" />
            <div className="elder-overlay-title">Getting help</div>
            <div className="elder-help-text">{state.profile.emergencyNote || "Your caregiver will be notified."}</div>
            {primaryContact?.name && <div className="elder-help-name">{primaryContact.name}</div>}
            {primaryContact?.phone && <div className="elder-help-phone">{primaryContact.phone}</div>}

      {msgOpen && (
        <div className="elder-overlay">
          <div className="elder-overlay-card elder-message-card">
            <div className="elder-overlay-title">{t("message", lang)}</div>
            <Messages state={state} persist={persist} role="elderly" big />
            <button className="elder-take-btn" onClick={() => setMsgOpen(false)}>Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- MESSAGES (elder <-> caregiver) ---------------- */
const QUICK_MESSAGES = {
  elderly: ["I'm okay 👍", "I need help", "Please call me", "Running low on medicine", "Thank you!"],
  caregiver: ["Take your medicine 💊", "I'm on my way", "Call me when you can", "Love you!", "Did you eat yet?"],
};
function Messages({ state, persist, role, big }) {
  const [text, setText] = useState("");
  const listRef = useRef(null);
  const messages = state.messages || [];

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages.length]);

  const send = (body) => {
    const body2 = (body ?? text).trim();
    if (!body2) return;
    const msg = { id: uid(), from: role, text: body2, at: new Date().toISOString() };
    persist({ ...state, messages: [...messages, msg] });
    setText("");
  };

  return (
    <div className={big ? "msg-wrap msg-wrap--big" : "msg-wrap"}>
      <div className="msg-list" ref={listRef}>
        {messages.length === 0 && <div className="empty-note">No messages yet — say hello!</div>}
        {messages.map((m) => (
          <div key={m.id} className={`msg-bubble ${m.from === role ? "msg-bubble--me" : "msg-bubble--them"}`}>
            <div className="msg-bubble-text">{m.text}</div>
            <div className="msg-bubble-time">{new Date(m.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
          </div>
        ))}
      </div>
      <div className="msg-quick-row">
        {(QUICK_MESSAGES[role] || QUICK_MESSAGES.elderly).map((q) => (
          <button key={q} className="msg-quick-btn" onClick={() => send(q)}>{q}</button>
        ))}
      </div>
      <div className="msg-input-row">
        <input className="form-input msg-input" placeholder="Type a message…" value={text}
          onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
        <button className="msg-send-btn" onClick={() => send()} title="Send"><Send size={18} /></button>
      </div>
    </div>
  );
}

/* ---------------- CHAT MODAL (AI assistant, Gemini API) ---------------- */
function ChatModal({ state, role, lang, onClose }) {
  const [history, setHistory] = useState([]);
  const [text, setText] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const listRef = useRef(null);

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [history.length, loading]);

  const system = role === "caregiver"
    ? `You are the in-app assistant for PillPal, a pill dispenser app for an elderly person with dementia and their caregiver. You are speaking with the caregiver. Answer questions about how to use the app (scheduling slots, the 12-slot dispenser, scanning medication photos, contacts, adherence log) and about the data below. Be concise, warm, and practical.\n\n${stateSummaryForAI(state)}`
    : `You are the in-app assistant for PillPal, speaking directly with an elderly user who may have mild memory difficulties. Use very short, simple, warm sentences. Answer questions about their medicine schedule using the data below, or about how to use the app (the big buttons on their home screen: Need help, Message, Ask a question, YouTube). Never give new medical advice — for medical questions, gently suggest they ask their caregiver or doctor.\n\n${stateSummaryForAI(state)}`;

  const send = async (body) => {
    const q = (body ?? text).trim();
    if (!q || loading) return;
    const next = [...history, { role: "user", content: q }];
    setHistory(next);
    setText("");
    setLoading(true);
    setError(null);
    try {
      const reply = await askClaude(next.map((m) => ({ role: m.role, content: m.content })), system);
      setHistory([...next, { role: "assistant", content: reply || "Sorry, I didn't catch that." }]);
    } catch (e) {
      setError(geminiConfigured() ? "The assistant isn't reachable right now. Please try again in a moment." : "The assistant isn't set up yet — a caregiver needs to add a Gemini API key to this device.");
    } finally {
      setLoading(false);
    }
  };

  const big = role === "elderly";

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={`modal-card ${big ? "modal-card--big-text" : ""}`} onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">

/* ---------------- SCAN MODAL (AI photo → slot assignment) ---------------- */
function ScanModal({ state, persist, showToast, onClose }) {
  const [imageData, setImageData] = useState(null); // { base64, mediaType }
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [suggestion, setSuggestion] = useState(null); // { name, dose, timesPerDay, suggestedTime }
  const [targetSlot, setTargetSlot] = useState(null);
  const fileRef = useRef(null);

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:image/jpeg;base64,....
      const [meta, b64] = String(result).split(",");
      const mediaType = (meta.match(/data:(.*);base64/) || [, "image/jpeg"])[1];
      setImageData({ base64: b64, mediaType });
      setSuggestion(null);
      setError(null);
    };
    reader.readAsDataURL(file);
  };

  const analyze = async () => {
    if (!imageData) return;
    setLoading(true);
    setError(null);
    try {
      const parsed = await askClaudeVision(imageData.base64, imageData.mediaType);
      setSuggestion(parsed);
      const nextEmpty = state.slots.find((s) => !s.name);
      setTargetSlot(nextEmpty ? nextEmpty.id : state.slots[0].id);
    } catch (e) {
      setError("Couldn't read that photo automatically. You can still fill the slot in manually.");
    } finally {
      setLoading(false);
    }
  };

  const saveToSlot = () => {
    if (!suggestion || !targetSlot) return;
    const slots = state.slots.map((s) => s.id === targetSlot ? {
      ...s,
      name: suggestion.name || s.name,
      dose: suggestion.dose || s.dose,
      time: /^\d{2}:\d{2}$/.test(suggestion.suggestedTime || "") ? suggestion.suggestedTime : s.time,
      active: true,
    } : s);
    persist({ ...state, slots });
    showToast(`"${suggestion.name}" assigned to slot ${targetSlot}. Load that slot in the dispenser now.`);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-header-title"><Camera size={18} /> Scan medication</div>
          <button className="icon-btn" onClick={onClose}><X size={16} /></button>
        </div>
        <div className="scan-body">
          {!imageData && (
            <button className="scan-drop" onClick={() => fileRef.current && fileRef.current.click()}>
              <Camera size={30} />
              <span>Take or upload a photo of the medication label</span>
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={onFile} />
          {imageData && (
            <img className="scan-preview" src={`data:${imageData.mediaType};base64,${imageData.base64}`} alt="Medication" />
          )}
          {imageData && !suggestion && (
            <button className="btn-primary" onClick={analyze} disabled={loading}>
              {loading ? "Reading label…" : (<><Sparkles size={16} /> Analyze with AI</>)}
            </button>
          )}
          {error && <div className="chat-error">{error}</div>}
          {suggestion && (
            <div className="scan-suggestion">
              <label className="form-label">Medicine name</label>
              <input className="form-input" value={suggestion.name || ""} onChange={(e) => setSuggestion({ ...suggestion, name: e.target.value })} />
              <label className="form-label">Dose / notes</label>
              <input className="form-input" value={suggestion.dose || ""} onChange={(e) => setSuggestion({ ...suggestion, dose: e.target.value })} />
              <label className="form-label">Suggested time</label>
              <input className="form-input" type="time" value={suggestion.suggestedTime || "08:00"} onChange={(e) => setSuggestion({ ...suggestion, suggestedTime: e.target.value })} />
              <label className="form-label">Assign to slot</label>
              <div className="day-chips">
                {state.slots.map((s) => (
                  <button key={s.id} className={`day-chip ${targetSlot === s.id ? "on" : ""}`} onClick={() => setTargetSlot(s.id)}>{s.id}</button>
                ))}
              </div>
              <button className="btn-primary" style={{ marginTop: 14 }} onClick={saveToSlot}><Check size={18} /> Save to slot {targetSlot}</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- SETUP / ONBOARDING ---------------- */
function Setup({ state, persist, onDone }) {
  const [step, setStep] = useState(0);
  const [draft, setDraft] = useState(state);
  const [deviceChoice, setDeviceChoice] = useState(null); // "caregiver" | "elderly"
  const [enteredCode, setEnteredCode] = useState("");
  const [linkError, setLinkError] = useState("");
  const [linking, setLinking] = useState(false);
  const lang = draft.language || "en";

  const update = (patch) => setDraft({ ...draft, ...patch });
  const next = () => setStep((s) => s + 1);
  const prev = () => setStep((s) => Math.max(0, s - 1));

  const steps = deviceChoice === "elderly"
    ? ["language", "device", "link"]
    : ["language", "device", "account", "elderly", "link"];
  const current = steps[step];

  const finish = (finalDraft) => {
    const complete = { ...finalDraft, setupComplete: true, deviceRole: deviceChoice };
    onDone(complete);
  };

  return (
    <div className="app-frame">
      <div className="setup-scroll">
        <LogoMark size={44} />
        <div className="role-brand">{t("setupWelcome", lang)}</div>
        <p className="role-hint">{t("setupWelcomeSub", lang)}</p>

        {current === "language" && (
          <div className="setup-step">
            <div className="setup-step-title">{t("chooseLanguage", lang)}</div>
            <p className="setup-step-sub">{t("chooseLanguageSub", lang)}</p>
            <div className="lang-grid">
              {LANGUAGES.map((l) => (
                <button key={l.code} className={`lang-card ${draft.language === l.code ? "on" : ""}`}
                  onClick={() => update({ language: l.code })}>
                  <span className="lang-native">{l.native}</span>
                  <span className="lang-label">{l.label}</span>
                  {l.note && <span className="lang-note">{l.note}</span>}
                </button>
              ))}
            </div>
            <button className="btn-primary" style={{ marginTop: 16 }} onClick={next}>{t("continue", lang)}</button>
          </div>
        )}

        {current === "device" && (
          <div className="setup-step">
            <div className="setup-step-title">Which device is this?</div>
            <p className="setup-step-sub">Set up the caregiver's phone first, then set up the dispenser using the same steps.</p>
            <button className={`role-card role-card--care`} onClick={() => { setDeviceChoice("caregiver"); setStep(step + 1); }}>
              <Users size={28} />
              <div><div className="role-card-title">Caregiver's phone</div><div className="role-card-sub">Creates the account &amp; schedule</div></div>
              <ChevronRight size={20} className="role-card-chevron" />
            </button>
            <button className={`role-card role-card--elder`} onClick={() => { setDeviceChoice("elderly"); setStep(step + 1); }}>
              <Sun size={28} />
              <div><div className="role-card-title">The dispenser at home</div><div className="role-card-sub">Links to an existing account</div></div>
              <ChevronRight size={20} className="role-card-chevron" />
            </button>
          </div>
        )}

        {current === "account" && (
          <div className="setup-step">
            <div className="setup-step-title">{t("caregiverAccount", lang)}</div>
            <p className="setup-step-sub">{t("caregiverAccountSub", lang)}</p>
            <label className="form-label">{t("yourName", lang)}</label>
            <input className="form-input" value={draft.account.caregiverName}
              onChange={(e) => update({ account: { ...draft.account, caregiverName: e.target.value } })} />
            <label className="form-label">{t("yourContact", lang)}</label>
            <input className="form-input" value={draft.account.caregiverContact}
              onChange={(e) => update({ account: { ...draft.account, caregiverContact: e.target.value } })} />
            <div className="setup-nav">
              <button className="mini-btn mini-btn--muted" onClick={prev}>{t("back", lang)}</button>
              <button className="btn-primary" onClick={next}>{t("continue", lang)}</button>
            </div>
          </div>
        )}

        {current === "elderly" && (
          <div className="setup-step">
            <div className="setup-step-title">{t("elderlyProfile", lang)}</div>
            <p className="setup-step-sub">{t("elderlyProfileSub", lang)}</p>
            <label className="form-label">{t("theirName", lang)}</label>
            <input className="form-input" value={draft.profile.elderlyName}
              onChange={(e) => update({ profile: { ...draft.profile, elderlyName: e.target.value } })} />
            <label className="form-label">{t("emergencyNoteLabel", lang)}</label>
            <input className="form-input" value={draft.profile.emergencyNote}
              onChange={(e) => update({ profile: { ...draft.profile, emergencyNote: e.target.value } })} />
            <div className="setup-nav">
              <button className="mini-btn mini-btn--muted" onClick={prev}>{t("back", lang)}</button>
              <button className="btn-primary" onClick={next}>{t("continue", lang)}</button>
            </div>
          </div>
        )}

        {current === "link" && deviceChoice === "caregiver" && (
          <div className="setup-step">
            <div className="setup-step-title">{t("linkTitle", lang)}</div>
            <p className="setup-step-sub">{t("linkSub", lang)}</p>
            <div className="link-code-box">
              <div className="card-label">{t("linkCodeLabel", lang)}</div>
              <div className="link-code-digits">{draft.account.linkCode}</div>
            </div>
            <div className="setup-nav">
              <button className="mini-btn mini-btn--muted" onClick={prev}>{t("back", lang)}</button>
              <button className="btn-primary" onClick={() => finish({ ...draft, account: { ...draft.account, elderlyLinked: false } })}>
                {t("finishSetup", lang)}
              </button>
            </div>
          </div>
        )}

        {current === "link" && deviceChoice === "elderly" && (
          <div className="setup-step">
            <div className="setup-step-title"><Link2 size={18} style={{ verticalAlign: "-3px", marginRight: 6 }} />{t("enterLinkCode", lang)}</div>
            <p className="setup-step-sub">{t("thisIsDispenser", lang)}</p>
            <input className="form-input link-code-input" inputMode="numeric" maxLength={6} value={enteredCode}
              onChange={(e) => { setEnteredCode(e.target.value.replace(/\D/g, "")); setLinkError(""); }} placeholder="000000" />
            {linkError && <div className="chat-error">{linkError}</div>}
            <div className="setup-nav">
              <button className="mini-btn mini-btn--muted" onClick={prev}>{t("back", lang)}</button>
              <button className="btn-primary" disabled={linking} onClick={async () => {
                if (enteredCode.length !== 6) { setLinkError("Enter the 6-digit code from the caregiver's phone."); return; }
                if (!fb) {
                  // No Firebase configured — fall back to same-browser demo behaviour.
                  finish({ ...draft, account: { ...draft.account, linkCode: enteredCode, elderlyLinked: true } });
                  return;
                }
                setLinking(true); setLinkError("");
                try {
                  await ensureSignedIn();
                  const doc = await familyDocRef(enteredCode).get();
                  if (!doc.exists) {
                    setLinkError("That code doesn't match — check the caregiver's phone and try again.");
                    setLinking(false);
                    return;
                  }
                  // Adopt the caregiver's family record as this device's own
                  // state — same schedule, same messages, same language —
                  // and mark it as the dispenser going forward.
                  const family = doc.data();
                  finish({ ...family, deviceRole: "elderly", language: draft.language || family.language,
                    account: { ...family.account, elderlyLinked: true } });
                } catch (e) {
                  setLinkError("Couldn't reach the server — check the internet connection and try again.");
                } finally {
                  setLinking(false);
                }
              }}>{linking ? "Linking…" : t("continue", lang)}</button>
            </div>
            <button className="link-btn" style={{ margin: "12px auto 0" }} onClick={() => finish(draft)}>{t("skipForNow", lang)}</button>
          </div>
        )}
      </div>
    </div>
  );
}

      .mini-btn { display:inline-flex; align-items:center; gap:5px; background: var(--amber-soft); color:#714A16; border:none;
        padding:7px 12px; border-radius:9px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
      .mini-btn--muted { background: var(--slate-100); color: var(--ink-soft); }
      .toggle { width:38px; height:22px; border-radius:999px; background: var(--slate-100); border:none; position:relative; cursor:pointer; flex-shrink:0; }
      .toggle-on { background: var(--sage); }
      .toggle-knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition: left .15s; }
      .toggle-on .toggle-knob { left:18px; }

      /* log */
      .range-row { display:flex; gap:8px; margin-bottom:14px; }
      .range-btn { background:#fff; border:1px solid var(--slate-100); padding:6px 14px; border-radius:999px; font-size:12.5px; color: var(--ink-soft); cursor:pointer; }
      .range-btn.active { background: var(--ink); color:#fff; border-color: var(--ink); }
      .mono { font-family: var(--font-care-mono); }
      .log-card { background:#fff; border:1px solid var(--slate-100); border-radius:12px; padding:12px 14px; margin-bottom:9px; }
      .log-card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
      .log-date { font-size:11.5px; color: var(--ink-soft); }
      .log-name { font-size:14px; font-weight:600; color: var(--ink); }
      .log-time { font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
      .log-actions { display:flex; gap:8px; margin-top:10px; }

      /* contacts */
      .contact-card { margin-bottom:10px; }
      .btn-primary { width:100%; background: var(--amber); color:#fff; border:none; padding:13px 16px; border-radius:12px;
        font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
      .btn-primary:disabled { background: var(--slate-100); color: var(--ink-soft); cursor:not-allowed; }

      /* settings */
      .setting-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--slate-100); gap:12px; }
      .setting-row:last-child { border-bottom:none; }
      .setting-title { font-size:13.5px; font-weight:600; color: var(--ink); }
      .setting-sub { font-size:11.5px; color: var(--ink-soft); }
      .danger-btn { margin-top:10px; background: var(--clay); color:#fff; border:none; padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; }

      /* elderly — background gradient set inline per time of day on .app-frame */
      .elder-content { flex:1; overflow-y:auto; padding: 26px 22px; display:flex; flex-direction:column; align-items:center;
        justify-content:space-between; text-align:center; position:relative; font-family: var(--font-elder-body);
        transition: color .8s ease; }
      .elder-switch { position:absolute; top:14px; right:14px; background: rgba(255,255,255,0.55); border:1px solid rgba(35,47,71,0.12);
        width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:15px; color: var(--ink-soft); backdrop-filter: blur(6px); }
      .elder-top { display:flex; flex-direction:column; align-items:center; gap:2px; }
      .elder-greeting { display:flex; align-items:center; gap:8px; color: var(--ink-soft); font-size:16px; margin-bottom:2px; }
      .elder-clock { font-family: var(--font-elder-display); font-optical-sizing:auto; font-weight:600; font-size:clamp(42px,14vw,62px); color: var(--ink); line-height:1; }
      .elder-date { font-size:15px; color: var(--ink-soft); }
      .elder-card { background:#fff; border-radius:20px; padding:22px 28px; width:100%;
        box-shadow: 0 14px 34px rgba(35,47,71,0.12); display:flex; flex-direction:column; align-items:center; gap:5px; transition: box-shadow .8s ease; }
      .elder-card-label { font-size:13px; color: var(--ink-soft); font-weight:600; }
      .elder-card-name { display:flex; align-items:center; gap:9px; font-family: var(--font-elder-display); font-size:23px; font-weight:600; color: var(--ink); text-align:center; }
      .elder-card-time { font-size:20px; color: var(--amber); font-weight:700; }
      .elder-help-btn { display:flex; align-items:center; gap:9px; background: var(--ink); color:#fff; border:none;
        padding:15px 26px; border-radius:999px; font-size:16px; font-weight:700; cursor:pointer; font-family: var(--font-elder-body); }

      .elder-content--night { --ink:#F1EFE6; --ink-soft:#AEB8D2; }
      .elder-content--night .elder-switch { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.18); }
      .elder-content--night .elder-card { box-shadow: 0 0 46px rgba(120,150,220,0.28), 0 14px 34px rgba(0,0,0,0.4); }
      .elder-content--night .elder-help-btn { background:#F1EFE6; color:#1A2236; }

      .elder-overlay { position:absolute; inset:0; background: rgba(23,30,46,0.58); display:flex; align-items:center;
        justify-content:center; z-index:1000; padding:20px; backdrop-filter: blur(3px); border-radius:28px; }
      .elder-overlay-card { background:#fff; border-radius:24px; padding:32px 26px; width:100%;
        display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
        box-shadow: 0 30px 70px rgba(0,0,0,0.28); animation: pop .25s ease; }
      @keyframes pop { from { transform: scale(0.92); opacity:0; } to { transform: scale(1); opacity:1; } }
      .elder-pill-icon { width:78px; height:78px; border-radius:50%; background: var(--amber); display:flex;
        align-items:center; justify-content:center; margin-bottom:4px; animation: pulse 1.6s infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(194,128,46,0.35); } 50% { box-shadow: 0 0 0 14px rgba(194,128,46,0); } }
      .elder-overlay-title { font-family: var(--font-elder-display); font-weight:600; font-size:20px; color: var(--ink); }
      .elder-overlay-name { font-size:25px; font-weight:700; color: var(--ink); }
      .elder-overlay-dose { font-size:15px; color: var(--ink-soft); }
      .elder-help-text { font-size:16px; color: var(--ink-soft); margin: 3px 0; }
      .elder-help-name { font-size:16px; color: var(--ink); font-weight:700; }
      .elder-help-phone { font-family: var(--font-care-mono); font-size:19px; color: var(--ink); font-weight:600; }
      .elder-take-btn { margin-top:12px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
        background: var(--sage); color:#fff; border:none; padding:16px; border-radius:16px; font-size:18px;
        font-weight:700; cursor:pointer; font-family: var(--font-elder-body); }
      .elder-snooze-btn { background:none; border:none; color: var(--ink-soft); font-size:14px; text-decoration:underline; cursor:pointer; margin-top:2px; font-family: var(--font-elder-body); }

      /* elder quick-action row */
      .elder-quick-row { display:flex; gap:10px; width:100%; margin-top:2px; }
      .elder-quick-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; background: rgba(255,255,255,0.7);
        border:1px solid rgba(35,47,71,0.1); color: var(--ink); padding:12px 6px; border-radius:16px; font-size:12px; font-weight:700;
        cursor:pointer; font-family: var(--font-elder-body); text-decoration:none; backdrop-filter: blur(6px); }
      .elder-content--night .elder-quick-btn { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.16); }
      .elder-message-card { max-width: 340px; width:100%; }

      /* boot bar */
      .boot-bar { width:120px; height:4px; border-radius:4px; background: var(--slate-100); overflow:hidden; margin-top:4px; }
      .boot-bar-fill { height:100%; width:40%; background: var(--amber); border-radius:4px; animation: bootSlide 1.1s ease-in-out infinite; }
      @keyframes bootSlide { 0%{ margin-left:-40%; } 100%{ margin-left:100%; } }

      /* floating AI chat button */
      .fab-chat { position:absolute; right:16px; bottom:78px; width:46px; height:46px; border-radius:50%;
        background: linear-gradient(155deg, var(--teal), #1D4C55); color:#fff; border:none; display:flex; align-items:center;
        justify-content:center; box-shadow: 0 10px 22px rgba(42,107,119,0.38); cursor:pointer; z-index: 40; }

      /* messages */
      .msg-wrap { display:flex; flex-direction:column; height:340px; }
      .msg-wrap--big { height:280px; }
      .msg-list { flex:1; overflow-y:auto; padding:4px 2px; display:flex; flex-direction:column; gap:8px; }
      .msg-bubble { max-width:78%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.35; }
      .msg-bubble--them { align-self:flex-start; background: var(--slate-100); color: var(--ink); border-bottom-left-radius:4px; }
      .msg-bubble--me { align-self:flex-end; background: var(--teal); color:#fff; border-bottom-right-radius:4px; }
      .msg-bubble-time { font-size:10px; opacity:0.65; margin-top:3px; }
      .msg-quick-row { display:flex; gap:6px; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--slate-100); }
      .msg-quick-btn { background: var(--amber-soft); color:#714A16; border:none; padding:7px 11px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; }
      .msg-input-row { display:flex; gap:8px; margin-top:6px; }
      .msg-input { flex:1; }
      .msg-send-btn { width:40px; height:40px; border-radius:12px; border:none; background: var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }

      /* modal (chat + scan) */
      .modal-overlay { position:fixed; inset:0; background: rgba(23,30,46,0.5); display:flex; align-items:flex-end;
        justify-content:center; z-index:1100; backdrop-filter: blur(2px); }
      .modal-card { background:#fff; width:100%; max-width:420px; border-radius:22px 22px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));
        max-height:82vh; display:flex; flex-direction:column; box-shadow: 0 -20px 50px rgba(0,0,0,0.25); animation: slideUp .2s ease; }
      @keyframes slideUp { from { transform: translateY(24px); opacity:0.6; } to { transform: translateY(0); opacity:1; } }
      .modal-card--big-text .msg-bubble { font-size:16px; }
      .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
      .modal-header-title { display:flex; align-items:center; gap:7px; font-weight:700; font-size:15px; color: var(--ink); }
      .modal-chat-list { min-height:180px; }
      .chat-error { font-size:12px; color:#8A3B2E; background:#FCEEE9; border-radius:10px; padding:8px 10px; margin-top:6px; }

      /* scan */
      .scan-cta { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background: var(--teal-soft); color:#1D4C55;
        border:none; padding:11px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; margin-bottom:14px; }
      .scan-body { display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
      .scan-drop { display:flex; flex-direction:column; align-items:center; gap:10px; padding:30px 16px; border:2px dashed var(--slate-100);
        border-radius:16px; background: var(--slate-50); color: var(--ink-soft); font-size:13px; cursor:pointer; text-align:center; }
      .scan-preview { width:100%; max-height:220px; object-fit:cover; border-radius:14px; }
      .scan-suggestion { display:flex; flex-direction:column; }

      /* setup / onboarding */
      .setup-scroll { flex:1; overflow-y:auto; padding:30px 22px 26px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px;
        background: linear-gradient(180deg, #D6E5EC 0%, #EAF0E7 45%, var(--cream) 100%); }
      .setup-step { width:100%; text-align:left; margin-top:18px; }
      .setup-step-title { font-family: var(--font-elder-display); font-weight:600; font-size:17px; color: var(--ink); text-align:center; }
      .setup-step-sub { font-size:12.5px; color: var(--ink-soft); text-align:center; margin:4px 0 16px; }
      .setup-nav { display:flex; gap:10px; margin-top:16px; }
      .setup-nav .btn-primary { flex:1; }
      .lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
      .lang-card { background:#fff; border:1px solid var(--slate-100); border-radius:13px; padding:12px 8px; display:flex;
        flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
      .lang-card.on { border-color: var(--teal); background: var(--teal-soft); }
      .lang-native { font-size:15px; font-weight:700; color: var(--ink); }
      .lang-label { font-size:11px; color: var(--ink-soft); }
      .lang-note { font-size:9.5px; color: var(--ink-soft); opacity:0.75; }
      .link-code-box { background:#fff; border:1px solid var(--slate-100); border-radius:16px; padding:18px; text-align:center; }
      .link-code-digits { font-family: var(--font-care-mono); font-size:34px; font-weight:700; letter-spacing:0.12em; color: var(--ink); margin-top:4px; }
      .link-code-input { text-align:center; font-family: var(--font-care-mono); font-size:24px; letter-spacing:0.2em; padding:14px; }

      @media (prefers-reduced-motion: reduce) {
        .elder-pill-icon, .elder-overlay-card { animation: none; }
        * { transition-duration: 0.01ms !important; }
      }

      @media (max-width: 460px) {
        .app-frame { border-radius:0; min-height:100vh; height:100vh; box-shadow:none; border:none; }
        #root { padding:0; }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
